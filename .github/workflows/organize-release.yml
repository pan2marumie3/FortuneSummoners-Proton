name: Organize v0.1.0 Release
on:
  push:
    branches: [main]
    paths:
      - README.md
      - .github/workflows/organize-release.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  tidy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source and license documents
        uses: actions/checkout@v4
      - name: Verify repository license and source references
        run: |
          set -euo pipefail
          test -s third_party/LICENSE.proton
          test -s third_party/dist.LICENSE
          test -s third_party/Wine-COPYING.LIB
          test -s third_party/NOTICE.md
          test -s patches/wma-loop-zero-seek.patch
          test -s RELEASE_NOTES_v0.1.0.md
      - name: Verify release archive checksum and bundled licenses
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p verify
          gh release download v0.1.0 --repo "$GITHUB_REPOSITORY" --pattern 'GE-Proton11-9-WMA-Loop-aarch64.tar.gz' --pattern 'GE-Proton11-9-WMA-Loop-aarch64.sha512sum' --dir verify
          (cd verify && sha512sum -c GE-Proton11-9-WMA-Loop-aarch64.sha512sum)
          tar -tzf verify/GE-Proton11-9-WMA-Loop-aarch64.tar.gz > "$RUNNER_TEMP/proton-members.txt"
          echo 'License-related paths in the binary archive:'
          awk 'tolower($0) ~ /license|copying|notice/ { if (++n <= 80) print }' "$RUNNER_TEMP/proton-members.txt"
          if ! grep -Eq '(^|/)LICENSE.proton$' "$RUNNER_TEMP/proton-members.txt"; then
            echo 'Missing LICENSE.proton in archive; stopped without deleting assets' >&2
            exit 1
          fi
          if ! grep -Eq '(^|/)dist.LICENSE$' "$RUNNER_TEMP/proton-members.txt"; then
            echo 'Missing dist.LICENSE in archive; stopped without deleting assets' >&2
            exit 1
          fi
          grep -Eq '(^|/)toolmanifest.vdf$' "$RUNNER_TEMP/proton-members.txt"
      - name: Update public release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit v0.1.0 --repo "$GITHUB_REPOSITORY" --notes-file RELEASE_NOTES_v0.1.0.md
      - name: Remove duplicate documentation assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for asset in SOURCE-AND-LICENSES.md UPSTREAM-dist.LICENSE UPSTREAM-LICENSE.proton Wine-LGPL-2.1.txt wma-loop-zero-seek.patch; do
            if gh release view v0.1.0 --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fxq "$asset"; then
              gh release delete-asset v0.1.0 "$asset" --repo "$GITHUB_REPOSITORY" --yes
            fi
          done
      - name: Verify only tarball and checksum remain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          actual="$(gh release view v0.1.0 --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | LC_ALL=C sort)"
          expected="$(printf '%s\n' GE-Proton11-9-WMA-Loop-aarch64.sha512sum GE-Proton11-9-WMA-Loop-aarch64.tar.gz | LC_ALL=C sort)"
          printf 'Assets:\n%s\n' "$actual"
          test "$actual" = "$expected"
