name: Organize v0.1.0 Release
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/organize-release.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  tidy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout release docs and packaging script
        uses: actions/checkout@v4
      - name: Verify and package license notices, then tidy assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/organize_release.sh
