name: Sync v0.1.0 Release Notes
on:
  push:
    branches: [main]
    paths:
      - RELEASE_NOTES_v0.1.0.md
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update v0.1.0 release description
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit v0.1.0 --repo "$GITHUB_REPOSITORY" --notes-file RELEASE_NOTES_v0.1.0.md
